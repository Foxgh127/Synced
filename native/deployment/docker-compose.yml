services:
  signal:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      TURN_URLS: "${TURN_URLS}"
      TURN_SECRET: "${TURN_SECRET}"
      ALLOWED_ORIGINS: "*"
    ports:
      - "8787:8787"

  coturn:
    image: coturn/coturn:4.14.0
    restart: unless-stopped
    network_mode: host
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM}
      - --external-ip=${PUBLIC_IP}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --no-tls
      - --no-dtls
      - --log-file=stdout
