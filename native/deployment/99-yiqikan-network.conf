# Small-room signaling, SFU, STUN and voice-TURN tuning.
# These are buffer ceilings, not reservations, so they remain safe on the
# 2 GiB test ECS while absorbing short mobile-network bursts.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.netdev_max_backlog = 8192
net.core.somaxconn = 4096
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# Detect dead proxy/mobile TCP paths promptly. The application heartbeat is
# still authoritative; these values are a kernel-level safety net.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_mtu_probing = 1
