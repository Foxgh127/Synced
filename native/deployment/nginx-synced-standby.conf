map $http_upgrade $synced_connection_upgrade {
    default upgrade;
    "" close;
}

limit_conn_zone $binary_remote_addr zone=synced_signal_connections:10m;
limit_req_zone $binary_remote_addr zone=synced_signal_upgrades:10m rate=5r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/synced-acme;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 47.98.173.139;

    ssl_certificate /etc/letsencrypt/live/47.98.173.139/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.98.173.139/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SYNCED_TLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /signal {
        limit_conn synced_signal_connections 8;
        limit_req zone=synced_signal_upgrades burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $synced_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_connect_timeout 3s;
        proxy_socket_keepalive on;
        proxy_buffering off;
    }

    location = /iceservers {
        limit_req zone=synced_signal_upgrades burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787/iceservers$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /media/v1/ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        send_timeout 25s;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8787/healthz;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://127.0.0.1:8787/readyz;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location = /capabilities {
        access_log off;
        limit_req zone=synced_signal_upgrades burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787/capabilities;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 204;
    }
}
